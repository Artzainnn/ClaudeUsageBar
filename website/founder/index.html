<!DOCTYPE html>
<html lang="en" style="background-color: #0d0d0f;">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0d0d0f">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow">
  <!-- Keep claudeusagebar.com as the referrer so YouTube Studio attributes the traffic -->
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <title>Building It My Way · ClaudeUsageBar</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #0d0d0f; color: #fafafa; font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif; text-align: center; }
    a { color: #da7756; }
    p { color: #a1a1aa; font-size: 14px; }
  </style>
  <script id="datafast-queue">
    window.datafast = window.datafast || function() {
      window.datafast.q = window.datafast.q || [];
      window.datafast.q.push(arguments);
    };
  </script>
  <script
    defer
    data-website-id="dfid_HMM2pp9guqaCpR3KioH9l"
    data-domain="claudeusagebar.com"
    src="https://datafa.st/js/script.js">
  </script>
</head>
<body>
  <div>
    <p>Taking you to the founder journey…</p>
    <p><a id="dest" href="https://www.youtube.com/watch?v=sDxEkMn4FMo">Continue to YouTube</a></p>
  </div>
  <noscript><meta http-equiv="refresh" content="0; url=https://www.youtube.com/watch?v=sDxEkMn4FMo"></noscript>
  <script>
    // Destination lives in one place (the link above). Short delay lets the
    // DataFast goal beacon leave before navigating; replace() keeps Back clean.
    var dest = document.getElementById("dest").href;
    try { window.datafast("founder_redirect"); } catch (e) {}
    setTimeout(function () { window.location.replace(dest); }, 400);
  </script>
</body>
</html>
